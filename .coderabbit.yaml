# CodeRabbit configuration.
#
# Without this file CodeRabbit runs on defaults, and those defaults do not match
# how this repository works. Each setting below is a deliberate decision with a
# stated reason, not a mute button.

reviews:
  profile: chill

  auto_review:
    # Reviews are requested by hand with `@coderabbitai review`. That is the
    # owner's choice: each round is asked for, so a review lands against a head
    # whose CI has settled rather than against every intermediate push.
    #
    # Recording it here makes it a decision. Until now the same outcome happened
    # by accident: this pull request is a draft, the default skips drafts, and
    # every push was answered with "Review skipped - Draft detected". Nobody
    # chose that.
    enabled: false

    # If automatic review is ever turned on, draft status must not silently skip
    # it. This pull request ran its entire review cycle as a draft.
    drafts: true

    # The default pauses automatic review after five reviewed commits, which is
    # what produced the recurring "Reviews paused" notices. Irrelevant while
    # automatic review is off, set so that enabling it does not resurrect them.
    auto_pause_after_reviewed_commits: 0

  pre_merge_checks:
    docstrings:
      # Off because the check measures a convention this codebase has never
      # adopted: zero JSDoc blocks and zero @param or @returns tags across
      # roughly 527 functions.
      #
      # The house style documents *why* a thing exists in prose comments above
      # the construct -- why the asset stamp must be injective, why the evidence
      # keyring accepts a retired key, why a session secret must not be reused.
      # The check does not count those, so it reports about 3% and would report
      # about 3% forever.
      #
      # Satisfying it would mean roughly 250 generated stubs restating signatures
      # the reader can already see, contradicting the established convention and
      # pushing the rationale comments out of view. That trades real explanation
      # for a passing number.
      mode: "off"
