name: Nebulaverse-X CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every other gate reads the migrations as text, so PostgreSQL never got a
    # say in whether this release's schema can exist. 015_alpha_privacy shipped
    # in a green candidate while being impossible to apply. Version 17 matches
    # the hosted database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # -U postgres because pg_isready defaults to the OS user, which is root
        # inside this container. Without it the probe asks for a role that does
        # not exist, never reports healthy, and the job dies during service
        # setup without running a step.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm test
      - run: npm run test:migrations
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: node scripts/audit-production.js
      - run: npm run check:secrets
      - run: npm run test:staging:gate
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:release -- "${RUNNER_TEMP}/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nebulaverse-X-release
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
