services:
  - type: web
    name: nebulaverse-x-public-alpha
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NV_SNAPSHOT_SIGNING_KEY_ID
        value: alpha17-snapshot-2026-08
      - key: NV_SNAPSHOT_SIGNING_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NV_DEPLOYMENT_PROFILE
        value: hosted-alpha
      - key: NV_ALPHA_ACCESS_MODE
        value: invite
      - key: NV_ALPHA_INVITE_PEPPER
        sync: false
      - key: NV_ALPHA_TERMS_VERSION
        value: 2026-07-29
      - key: NV_DATABASE_MIGRATION_MODE
        value: verify
      - key: NV_GOVERNANCE_AUDIT_SECRET
        sync: false
      - key: NV_GOVERNANCE_RUNTIME_FAILURE_MODE
        value: warn
      - key: NV_MAINTENANCE_MODE
        value: 0
      - key: NV_EVENT_RETENTION_DAYS
        value: 30
      - key: NV_SESSION_RETENTION_DAYS
        value: 7
      - key: NV_LIVE_CLIENTS_PER_REPO
        value: 2
      - key: NV_LIVE_CLIENTS_TOTAL
        value: 10
      - key: NV_SNAPSHOT_RETENTION_COUNT
        value: 10
      - key: NV_SNAPSHOT_MANIFEST_MAX
        value: 5000
      - key: NV_GIT_DATA_MAX_MB
        value: 16
      - key: NV_NATIVE_PUSH_MAX_MB
        value: 16
      - key: NV_UPLOAD_MAX_MB
        value: 25
      - key: NV_UPLOAD_CONCURRENCY
        value: 1
      - key: NV_UPLOAD_TIMEOUT_MINUTES
        value: 10
      - key: NV_STALE_UPLOAD_HOURS
        value: 2

      # Use a new dedicated Neon Free project for this cohort. Never reuse the
      # historical rehearsal database, a production database, or another service's
      # secrets. Do not add a Render database or persistent disk.

      # Optional GitHub OAuth and GitHub App values remain manual and disabled when
      # absent. Existing PAT/OAuth, GitLab, and Gitea connections remain supported:
      # GITHUB_CLIENT_ID=
      # GITHUB_CLIENT_SECRET=
      # GITHUB_APP_ID=
      # GITHUB_APP_SLUG=
      # GITHUB_APP_CLIENT_ID=
      # GITHUB_APP_CLIENT_SECRET=
      # GITHUB_APP_PRIVATE_KEY_BASE64=
      # GITHUB_APP_CALLBACK_URL=
      # GITHUB_APP_WEBHOOK_SECRET=
