name: Nebulaverse-X CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The browser suite used to run here on one worker after every other gate,
    # and its growth set this limit: 20, then 30, then 45 minutes, each raised
    # after the job was cancelled mid-suite with every test passing. At 45 the
    # suite alone took 40 minutes and the job was cancelled again, on main and
    # on a pull request. The suite now runs in the `browser` job below, split
    # four ways, and the gates left here finish in about five minutes.
    timeout-minutes: 15
    # Every other gate reads the migrations as text, so PostgreSQL never got a
    # say in whether this release's schema can exist. 015_alpha_privacy shipped
    # in a green candidate while being impossible to apply. Version 17 matches
    # the hosted database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # -U postgres because pg_isready defaults to the OS user, which is root
        # inside this container. Without it the probe asks for a role that does
        # not exist, never reports healthy, and the job dies during service
        # setup without running a step.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      # The architecture mission's baseline inventory, regenerated from the
      # baseline commit and compared byte for byte with the committed record.
      - run: node scripts/architecture-inventory.js --check
      # The browser build twice from the same tree: the served-assets digest the
      # server attests must name the same bytes on every build.
      - run: npm run build:web:check
      - run: npm run check:syntax
      - run: npm run lint
      # Before the suites and long before the browser gates: a type error should
      # be reported in seconds, not after fifteen minutes of Playwright.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migrations
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: npm run test:database-resilience
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The same database service, and the property the whole foundation plan
      # exists for: two processes, one database, one set of keys. Everything
      # else is proved against a fake or a source assertion, and none of those
      # can tell you whether a guard holds when the second process is real.
      - run: npm run test:multi-instance
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Exposure storage, against the same service. Nearly every property this
      # store depends on belongs to the database rather than to JavaScript:
      # idempotency is a unique index, one-live-scan-per-repository is a partial
      # unique index, the fencing token is a conditional UPDATE matching zero
      # rows, and the guarantee that no row can carry a credential is a set of
      # CHECK constraints and two integer arrays. A fake that decides a conflict
      # atomically does so because it was written to.
      - run: npm run test:exposure-store
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The audit history, against the same service: that no column can take a
      # line of code is a set of CHECK constraints, that an account's audits
      # leave with it is a cascade, and retention is a DELETE ordered by date.
      - run: npm run test:code-audit-history
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The governance lifecycle, against the same service. Switching a policy
      # off, archiving it, reusing its key and resetting a repository each rest
      # on a CHECK, a partial unique index, an append-only trigger or the outbox
      # constraint -- properties of the database that no fake can settle.
      - run: npm run test:governance-lifecycle
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The composed server, on a database of its own: where a session lives,
      # the protections an identity sets, what a webhook delivery leaves
      # behind, and the snapshots and restores Corona keeps; the same server
      # invite-only; a repository's governance, asked as its administrator, a
      # maintainer and a reader; exposure scanning end to end, its findings
      # fingerprinted with the key the composition derived and verified with
      # the credential's provider; and the server's own life -- the work it
      # takes up when it starts, and waits for when it stops. Built in the
      # test's process, as test/composition.test.js builds it without one,
      # and started as a deployment starts it.
      - run: npm run test:composition-postgres
        env:
          NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: node scripts/audit-production.js
      - run: npm run check:secrets
      - run: npm run test:staging:gate
      - run: npm run test:release

  # The browser suite, in six slices that run side by side, each with its own
  # server, as the qualification workflow's browser matrix runs it. One worker
  # per slice: the specs share one server and are not written to run
  # concurrently against it. Six, not four: the heaviest of four slices reached
  # its 20-minute bound on c9410a3 and b1a61d9, on runners that ran the
  # identical tests 40% slower than the runs before them.
  #
  # After `verify`, not beside it: a type error or a failing unit test is
  # reported in minutes and no browser time is spent on a change that fails
  # them. fail-fast is off so one slice's failure says whether the problem is
  # local to a few specs or general.
  #
  # Each step has its own bound, so neither can spend the other's time: the
  # browser's system packages usually install in under a minute, but a slow
  # Ubuntu mirror took eleven on 26 October and left a 20-minute job too little
  # for its tests. The install may take 15 minutes and the tests 18, and a hung
  # spec still fails at 18. Later that day the same mirror took more than
  # fifteen, so the packages are now kept between runs as well (below).
  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      # apt's downloads for the browsers come back from the Actions cache, so
      # a slow mirror costs only the packages that changed since the last run
      # (ci/browser-packages.sh). They are collected even when the install
      # fails, and kept under a name derived from the package files, so a run
      # cut short leaves the next one less to fetch and an unchanged set is
      # never saved twice.
      - name: Restore the browsers' system packages
        id: browser-packages
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: browser-packages-ubuntu-24.04-chromium.
          restore-keys: browser-packages-ubuntu-24.04-chromium.
      - name: Return them to apt's archive
        continue-on-error: true
        run: bash ci/browser-packages.sh restore "${RUNNER_TEMP}/browser-packages"
      - run: bash ci/install-browser.sh
        timeout-minutes: 15
      - name: Collect the browsers' system packages
        id: browser-packages-kept
        if: always()
        continue-on-error: true
        run: bash ci/browser-packages.sh collect "${RUNNER_TEMP}/browser-packages" browser-packages-ubuntu-24.04-chromium.
      - name: Keep them for the next run
        if: always() && steps.browser-packages-kept.outputs.key != '' && steps.browser-packages-kept.outputs.key != steps.browser-packages.outputs.cache-matched-key
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: ${{ steps.browser-packages-kept.outputs.key }}
      # The slice is read by playwright.config.js, so the command is the one a
      # local run uses; unset there, the whole suite runs.
      - run: npm run test:e2e
        timeout-minutes: 18
        env:
          NV_E2E_SHARD: ${{ matrix.shard }}/6
      # This job uses synthetic browser credentials. Keep only its diagnostics;
      # live-provider and hosted jobs must not upload browser session material.
      - name: Retain browser failure evidence
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-browser-failure-${{ github.event_name }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

  # Packaging is last: a release archive exists only for a change that passed
  # every gate and every browser slice.
  release:
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - run: npm run package:release -- "${RUNNER_TEMP}/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nebulaverse-X-release
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error

  # The browser install is bounded on its own, as in the browser job, and the
  # job is bounded with room for it.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Restore the browsers' system packages
        id: browser-packages
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: browser-packages-ubuntu-24.04-chromium-webkit.
          restore-keys: browser-packages-ubuntu-24.04-chromium-webkit.
      - name: Return them to apt's archive
        continue-on-error: true
        run: bash ci/browser-packages.sh restore "${RUNNER_TEMP}/browser-packages"
      - run: bash ci/install-browser.sh chromium webkit
        timeout-minutes: 15
      - name: Collect the browsers' system packages
        id: browser-packages-kept
        if: always()
        continue-on-error: true
        run: bash ci/browser-packages.sh collect "${RUNNER_TEMP}/browser-packages" browser-packages-ubuntu-24.04-chromium-webkit.
      - name: Keep them for the next run
        if: always() && steps.browser-packages-kept.outputs.key != '' && steps.browser-packages-kept.outputs.key != steps.browser-packages.outputs.cache-matched-key
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: ${{ steps.browser-packages-kept.outputs.key }}
      - run: bash ci/install-postgres-client.sh
      - run: npm run build:web
      - run: npm run test:restore-integration
      - run: npm run test:integration
      - name: Retain real browser integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-browser-integration-${{ github.event_name }}-${{ github.run_attempt }}
          path: test-results/integration/
          retention-days: 3
          if-no-files-found: error

  # The fallback runtime of ADR-088, proven on every commit rather than on the
  # day it is needed. The server is compiled into dist/server twice from the
  # same tree (the digest it reports as serverBuildSha256 must name the same
  # bytes both times) and every test that starts the server -- boot, health
  # and readiness on PostgreSQL, the route surface and the negative-request
  # matrix, the worker and child-process entries, the multi-instance programs
  # and the release smoke -- runs again against the compiled tree. `verify`
  # runs the same programs against the source, so the two runtimes answer the
  # same questions the same way or this job is red.
  server-compiled:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NV_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:server:check
      - run: npm run test:server-compiled
